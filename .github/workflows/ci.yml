name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-required:
    name: Web required
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prepare repository-volume temporary paths
        shell: pwsh
        run: |
          $workspaceParent = Split-Path -Parent (Get-Location).Path
          $temporaryPath = Join-Path $workspaceParent ".rednote-temp\web-${{ github.run_id }}-${{ github.run_attempt }}"
          $cachePath = Join-Path $workspaceParent '.rednote-npm-cache'
          $environmentFile = [System.Environment]::GetEnvironmentVariable('GITHUB_ENV')
          New-Item -ItemType Directory -Force -Path $temporaryPath, $cachePath | Out-Null
          "TEMP=$temporaryPath" | Out-File -FilePath $environmentFile -Append -Encoding utf8
          "TMP=$temporaryPath" | Out-File -FilePath $environmentFile -Append -Encoding utf8
          "npm_config_cache=$cachePath" | Out-File -FilePath $environmentFile -Append -Encoding utf8

      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format-check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run normal Vitest suite once
        run: node scripts/run-portable-vitest.mjs --observable --suite=normal run --maxWorkers=1 --no-file-parallelism
      - name: Build and inspect static Web artifact
        env:
          REDNOTE_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build:web
      - name: Build, package, and inspect Web Clipper artifact
        run: npm run build:clipper
      - name: Run Chrome and Edge Web smoke
        run: npm run smoke:web-e2e
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Upload exact-head Web preview and report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rednote-web-preview-${{ github.event.pull_request.head.sha }}
          path: |
            .vite/web/
            out/clipper/
            .rednote-temp/web-e2e-report.json
          if-no-files-found: error
          retention-days: 14

  windows-required:
    name: Windows required
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prepare repository-volume temporary paths
        shell: pwsh
        run: |
          $workspaceParent = Split-Path -Parent (Get-Location).Path
          $temporaryPath = Join-Path $workspaceParent ".rednote-temp\ci-${{ github.run_id }}-${{ github.run_attempt }}"
          $cachePath = Join-Path $workspaceParent '.rednote-npm-cache'
          $environmentFile = [System.Environment]::GetEnvironmentVariable('GITHUB_ENV')
          New-Item -ItemType Directory -Force -Path $temporaryPath, $cachePath | Out-Null
          "TEMP=$temporaryPath" | Out-File -FilePath $environmentFile -Append -Encoding utf8
          "TMP=$temporaryPath" | Out-File -FilePath $environmentFile -Append -Encoding utf8
          "npm_config_cache=$cachePath" | Out-File -FilePath $environmentFile -Append -Encoding utf8

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format-check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run normal Vitest suite once
        run: npm run test

      - name: Run isolated capacity Vitest suite once
        run: node scripts/run-portable-vitest.mjs --observable --suite=capacity run

      - name: Run Electron runtime smoke
        run: npm run test:electron-smoke

      - name: Build all workspaces
        run: npm run build

      - name: Package Windows desktop directory
        env:
          REDNOTE_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run package:desktop

      - name: Package Chrome and Edge unpacked extensions
        run: npm run package:clipper

      - name: Run packaged executable smoke
        run: npm run test:packaged-smoke

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Compare two semantic R10D installer builds
        env:
          REDNOTE_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run package:installer
          if ($LASTEXITCODE -ne 0) { throw "R10D_FIRST_INSTALLER_BUILD_FAILED:$LASTEXITCODE" }
          Copy-Item -LiteralPath out\installer -Destination out\installer-repro-a -Recurse
          node scripts/package-installer.mjs
          if ($LASTEXITCODE -ne 0) { throw "R10D_SECOND_INSTALLER_BUILD_FAILED:$LASTEXITCODE" }
          Copy-Item -LiteralPath out\installer -Destination out\installer-repro-b -Recurse
          node scripts/compare-r10d-installer-samples.mjs out\installer-repro-a out\installer-repro-b
          if ($LASTEXITCODE -ne 0) { throw "R10D_SEMANTIC_INSTALLER_COMPARE_FAILED:$LASTEXITCODE" }

      - name: Build isolated R10D beta.0 lifecycle fixture
        env:
          REDNOTE_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REDNOTE_PACKAGE_OUTPUT_VARIANT: r10d-beta0-fixture
          REDNOTE_R10D_CI_FIXTURE: '1'
          REDNOTE_R10D_CI_FIXTURE_VERSION: 0.1.0-beta.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/package-desktop.mjs
          if ($LASTEXITCODE -ne 0) { throw "R10D_BETA0_DESKTOP_BUILD_FAILED:$LASTEXITCODE" }
          $output = Join-Path (Get-Location) 'out'
          $fixture = Join-Path $output 'r10d-beta0-fixture'
          $canonicalPackage = @(Get-ChildItem -LiteralPath $output -Directory | Where-Object { $_.Name -like '*-win32-x64' })
          $fixturePackage = @(Get-ChildItem -LiteralPath $fixture -Directory | Where-Object { $_.Name -like '*-win32-x64' })
          if ($canonicalPackage.Count -ne 1 -or $fixturePackage.Count -ne 1) { throw 'R10D_BETA0_PACKAGE_LAYOUT_INVALID' }
          $canonicalManifest = Join-Path $canonicalPackage[0].FullName 'release-manifest.json'
          $canonicalBundle = Join-Path $output 'installer-bundle'
          $fixtureBundle = Join-Path $fixture 'installer-bundle'
          function Get-R10DIdentity([string]$path) {
            $records = @(Get-ChildItem -LiteralPath $path -File -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring($path.Length).TrimStart('\', '/')
              "$relative|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            })
            if ($records.Count -eq 0) { throw "R10D_EMPTY_IDENTITY:$path" }
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($records -join "`n")))).ToLowerInvariant()
          }
          if ((Get-Content -LiteralPath $canonicalManifest -Raw | ConvertFrom-Json).applicationVersion -ne '0.1.0-beta.1') { throw 'R10D_CANONICAL_MANIFEST_VERSION_INVALID' }
          if (@(Get-ChildItem -LiteralPath $canonicalBundle -File -Recurse).Count -ne 4) { throw 'R10D_CANONICAL_BUNDLE_LAYOUT_INVALID' }
          $canonicalPackageIdentityBefore = Get-R10DIdentity $canonicalPackage[0].FullName
          $canonicalBundleIdentityBefore = Get-R10DIdentity $canonicalBundle
          node scripts/package-installer.mjs
          if ($LASTEXITCODE -ne 0) { throw "R10D_BETA0_INSTALLER_BUILD_FAILED:$LASTEXITCODE" }
          if ((Get-R10DIdentity $canonicalPackage[0].FullName) -ne $canonicalPackageIdentityBefore -or (Get-R10DIdentity $canonicalBundle) -ne $canonicalBundleIdentityBefore) { throw 'R10D_CANONICAL_FIXTURE_MUTATED' }
          $fixtureManifest = Get-Content -LiteralPath (Join-Path $fixturePackage[0].FullName 'release-manifest.json') -Raw | ConvertFrom-Json
          $fixtureInstallers = @(Get-ChildItem -LiteralPath $fixtureBundle -File -Filter '*.exe')
          if ($fixtureManifest.applicationVersion -ne '0.1.0-beta.0' -or $fixtureInstallers.Count -ne 1 -or $fixtureInstallers[0].Name -ne 'RednoteStudio-0.1.0-beta.0-win-x64-setup.exe' -or @(Get-ChildItem -LiteralPath $fixtureBundle -File -Recurse).Count -ne 4) { throw 'R10D_BETA0_INSTALLER_VERSION_OR_LAYOUT_INVALID' }

      - name: Run isolated R10D installer lifecycle
        env:
          REDNOTE_R10D_LIFECYCLE_FIXTURE: '1'
        run: npm run test:installer-lifecycle

      - name: Prepare exact-head R10D installer artifact name
        if: github.event_name == 'pull_request'
        env:
          REDNOTE_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: |
          $exactHeadSha = [System.Environment]::GetEnvironmentVariable('REDNOTE_EXACT_HEAD_SHA')
          $environmentFile = [System.Environment]::GetEnvironmentVariable('GITHUB_ENV')
          $shortSha = $exactHeadSha.Substring(0, 8)
          "R10D_ARTIFACT_NAME=rednote-r10d-windows-installer-$shortSha" | Out-File -FilePath $environmentFile -Append -Encoding utf8

      - name: Upload exact-head R10D Windows installer bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.R10D_ARTIFACT_NAME }}
          path: out/installer-bundle/
          if-no-files-found: error
          retention-days: 14

      - name: Clean exact CI temporary directory
        if: always()
        env:
          REDNOTE_R10D_CI_CLEANUP: '1'
        run: node scripts/run-installer-lifecycle-smoke.mjs --cleanup-ci-temp
