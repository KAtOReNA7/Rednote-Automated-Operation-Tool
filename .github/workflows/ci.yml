name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-required:
    name: Windows required
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prepare repository-volume temporary paths
        shell: pwsh
        run: |
          $workspaceParent = Split-Path -Parent (Get-Location).Path
          $temporaryPath = Join-Path $workspaceParent ".rednote-temp\ci-${{ github.run_id }}-${{ github.run_attempt }}"
          $cachePath = Join-Path $workspaceParent '.rednote-npm-cache'
          $environmentFile = [System.Environment]::GetEnvironmentVariable('GITHUB_ENV')
          New-Item -ItemType Directory -Force -Path $temporaryPath, $cachePath | Out-Null
          "TEMP=$temporaryPath" | Out-File -FilePath $environmentFile -Append -Encoding utf8
          "TMP=$temporaryPath" | Out-File -FilePath $environmentFile -Append -Encoding utf8
          "npm_config_cache=$cachePath" | Out-File -FilePath $environmentFile -Append -Encoding utf8

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format-check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run immutable-constraint and architecture suites
        run: npm run test:constraints

      - name: Run SQLite migration and persistence suites
        run: npm run test:db

      - name: Run persistent local job queue suites
        run: npm run test:queue

      - name: Run local file repository suites
        run: npm run test:storage

      - name: Run desktop shell suites
        run: npm run test:desktop

      - name: Run local settings and credential-reference suites
        run: npm run test:settings

      - name: Run local loopback API and plugin-authentication suites
        run: npm run test:local-api

      - name: Run provider-neutral model interface suites
        run: npm run test:providers

      - name: Run repository-volume portability suites
        run: npm run test:portability

      - name: Run explicit provider capability probing suites
        run: npm run test:capabilities

      - name: Run model execution cache and accounting suites
        run: npm run test:model-accounting

      - name: Run unified search provider suites
        run: npm run test:search

      - name: Run controlled public page fetch suites
        run: npm run test:fetch

      - name: Run Chrome and Edge browser clipper suites
        run: npm run test:clipper

      - name: Run bibliographic discovery and entity resolution suites
        run: npm run test:bibliography

      - name: Run source evidence and fact conflict suites
        run: npm run test:evidence

      - name: Run versioned research dossier suites
        run: npm run test:dossier

      - name: Run reading authenticity and expression permission suites
        run: npm run test:authenticity

      - name: Run Topic Pool and First-30 quota suites
        run: npm run test:topics

      - name: Run versioned single-variable experiment suites
        run: npm run test:experiments

      - name: Run structured Content Brief suites
        run: npm run test:briefs

      - name: Run versioned Copy generation suites
        run: npm run test:copy

      - name: Run factual claim mapping and evidence trace suites
        run: npm run test:fact-mapping

      - name: Run Electron runtime smoke
        run: npm run test:electron-smoke

      - name: Run complete test suite
        run: npm run test

      - name: Build all workspaces
        run: npm run build

      - name: Package Windows desktop directory
        run: npm run package:desktop

      - name: Package Chrome and Edge unpacked extensions
        run: npm run package:clipper

      - name: Run packaged executable smoke
        run: npm run test:packaged-smoke

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Clean exact CI temporary directory
        if: always()
        shell: pwsh
        run: |
          $workspaceParent = Split-Path -Parent (Get-Location).Path
          $temporaryPath = Join-Path $workspaceParent ".rednote-temp\ci-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $temporaryPath) {
            Remove-Item -LiteralPath $temporaryPath -Recurse -Force
          }
