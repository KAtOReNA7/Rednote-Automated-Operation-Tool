name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-required:
    name: Windows required
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format-check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run immutable-constraint and architecture suites
        run: npm run test:constraints

      - name: Run SQLite migration and persistence suites
        run: npm run test:db

      - name: Run persistent local job queue suites
        run: npm run test:queue

      - name: Run local file repository suites
        run: npm run test:storage

      - name: Run desktop shell suites
        run: npm run test:desktop

      - name: Run Electron runtime smoke
        run: npm run test:electron-smoke

      - name: Run complete test suite
        run: npm run test

      - name: Build all workspaces
        run: npm run build

      - name: Package Windows desktop directory
        run: npm run package:desktop

      - name: Run packaged executable smoke
        run: npm run test:packaged-smoke

      - name: Audit dependencies
        run: npm run audit:dependencies
