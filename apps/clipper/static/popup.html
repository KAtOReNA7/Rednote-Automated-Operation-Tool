<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>保存公开页面样本</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><strong>收藏公开页面样本</strong><small>仅在你点击后读取当前页面</small></header>
      <p id="status" role="status" aria-live="polite"></p>
      <form id="clip-form" hidden>
        <label>页面 URL<input id="page-url" readonly /></label>
        <label>页面标题<input id="page-title" maxlength="512" required /></label>
        <label>选中文本<textarea id="selected-text" maxlength="12000"></textarea></label>
        <label>备注<textarea id="user-note" maxlength="4000"></textarea></label>
        <div class="actions">
          <button id="capture" type="button">截取当前可见区域</button>
          <button id="remove-screenshot" type="button" hidden>移除截图</button>
        </div>
        <img id="screenshot-preview" alt="当前可见区域截图预览" hidden />
        <label class="confirm"
          ><input
            id="public-confirmed"
            type="checkbox"
            required
          />这是我主动选择保存的公开页面样本；导出不会连接本地服务或云端</label
        >
        <button type="submit">下载 .rednote-clip.json</button>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
