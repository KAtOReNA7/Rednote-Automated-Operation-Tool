appId: io.github.katorena7.rednote-mystery-operations
productName: 红笺本地运营台
directories:
  output: out/installer
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  guid: 93211c80-b79d-59cd-848c-fd9f791d6cc2
  include: build/installer.nsh
  allowElevation: false
